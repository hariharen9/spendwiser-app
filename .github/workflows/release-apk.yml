name: Release Android APK

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Release APK (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare release artifacts
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          OUT_DIR="build/app/outputs/flutter-apk"
          SRC_APK="${OUT_DIR}/app-release.apk"
          DEST_APK="${OUT_DIR}/spendwiser-${TAG}.apk"

          if [[ ! -f "${SRC_APK}" ]]; then
            echo "Expected APK not found at ${SRC_APK}" >&2
            exit 1
          fi

          cp "${SRC_APK}" "${DEST_APK}"
          (cd "${OUT_DIR}" && sha256sum "spendwiser-${TAG}.apk" > "spendwiser-${TAG}.apk.sha256")

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SpendWiser ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/spendwiser-${{ github.ref_name }}.apk
            build/app/outputs/flutter-apk/spendwiser-${{ github.ref_name }}.apk.sha256

