function lrec(i,keep){const l=LN[i];if(!keep)PRD={t:'emi',a:l.e};sheet(`<div class=ser style="font-size:30px;margin-bottom:6px">Record payment</div><div class="mu sm" style="margin-bottom:8px">${l.n}</div>${seg([['emi','EMI'],['prep','Prepayment']],PRD.t,'lrt')}<input class=in id=la type=number placeholder="Amount" value="${PRD.a||''}" oninput="PRD.a=+this.value"><div class=sec><input class=in id=ld2 type=date value="${iso(Date.now())}" max="${iso(Date.now())}"><select class=in id=lf>${AC.map((a,k)=>`<option value=${k}>${a[0]}</option>`).join('')}</select></div><div class="mu sm" style="margin-bottom:12px">Interest is split out automatically and the balance updates.</div><button class="btn pri" onclick="lsv(${i})">Save payment</button>`)}
function lrt(k){const l=LN[LD];PRD.t=k;PRD.a=k=='emi'?l.e:PRD.a;lrec(LD,1)}
function lsv(i){const l=LN[i],a=+$('#la').value,ts=new Date(($('#ld2').value||iso(Date.now()))+'T12:00:00').getTime();if(!a)return toast('Enter an amount');const em=PRD.t=='emi',int=em?Math.min(a,Math.round(l.b*l.r/1200)):0,pr=Math.min(l.b,a-int);l.pays.push({ts,a,t:PRD.t,int,pr});l.b=Math.max(0,l.b-pr);addTx(l.n+(em?' EMI':' prepayment'),'EMI',-a,'a'+(+$('#lf').value),'',ts);PJ={p:0,x:0};xs();toast(l.b<1?'Loan fully repaid':'Payment recorded')}
function lpd(i,k){const l=LN[i],p=l.pays[k];sheet(`<div class=mu>${p.t=='emi'?'EMI':'Prepayment'} · ${dfy(new Date(p.ts))}</div><div class=ser style="font-size:44px">${R(p.a)}</div><div class="mu sm" style="margin-bottom:14px">Interest ${R(p.int||0)} · principal ${R(p.pr||0)}</div><button class=btn style="color:var(--co);text-align:center" onclick="lpx(${i},${k})">Delete this payment</button>`)}
function lpx(i,k){const l=LN[i],p=l.pays[k];l.b+=p.pr||0;l.pays.splice(k,1);const j=tx.findIndex(t=>t[7]==p.ts&&t[0].startsWith(l.n));if(j>=0){tfx(tx[j],-1);tx.splice(j,1)}xs();toast('Payment removed')}
function ledit(i){const l=LN[i];sheet(`<div class=ser style="font-size:30px;margin-bottom:12px">Edit loan</div><input class=in id=en2 value="${l.n}"><div class=sec><input class=in id=el value="${l.lender||''}" placeholder="Lender"><select class=in id=et2>${LTY.map(t=>`<option ${t==l.type?'selected':''}>${t}</option>`).join('')}</select></div><div class=sec><div><div class="sm mu">Outstanding</div><input class=in id=eb type=number value=${Math.round(l.b)}></div><div><div class="sm mu">Original principal</div><input class=in id=eo type=number value=${l.o}></div></div><div class=sec><div><div class="sm mu">Rate % p.a.</div><input class=in id=er2 type=number step=.1 value=${l.r}></div><div><div class="sm mu">EMI</div><input class=in id=ee2 type=number value=${l.e}></div></div><div class="sm mu">EMI day of month</div><input class=in id=ed2 type=number min=1 max=28 value=${l.dd||5}><button class="btn pri" onclick="Object.assign(LN[${i}],{n:$('#en2').value||LN[${i}].n,lender:$('#el').value,type:$('#et2').value,b:+$('#eb').value||0,o:+$('#eo').value||LN[${i}].o,r:+$('#er2').value||0,e:+$('#ee2').value||LN[${i}].e,dd:Math.min(28,Math.max(1,+$('#ed2').value||5))});xs();toast('Loan updated')">Save changes</button>`)}
function ldel(i){const l=LN[i];LN.splice(i,1);LD=-1;rr();toastU('Loan removed',()=>{LN.splice(i,0,l);rr()})}
function addl(){sheet(`<div class=ser style="font-size:30px;margin-bottom:12px">New loan</div><input class=in id=ln2 placeholder="Name (e.g. Home loan)"><div class=sec><input class=in id=el placeholder="Lender"><select class=in id=et2>${LTY.map(t=>`<option>${t}</option>`).join('')}</select></div><input class=in id=lp type=number placeholder="Outstanding principal" oninput="ep()"><div class=sec><input class=in id=lr2 type=number step=.1 placeholder="Rate % p.a." oninput="ep()"><input class=in id=ly type=number placeholder="Years left" oninput="ep()"></div><input class=in id=ed2 type=number min=1 max=28 placeholder="EMI day of month"><div class=ser style="font-size:34px;margin:6px 0 14px" id=epv>EMI ₹0 /mo</div><button class="btn pri" onclick="const P=+$('#lp').value,r=+$('#lr2').value/1200,n=+$('#ly').value*12;if(!P||!n)return toast('Fill amount and years');LN.push({n:$('#ln2').value||'Loan',lender:$('#el').value,type:$('#et2').value,b:P,o:P,r:+$('#lr2').value||0,e:Math.round(r?P*r*(1+r)**n/((1+r)**n-1):P/n),dd:Math.min(28,Math.max(1,+$('#ed2').value||5)),tn:n,sTs:Date.now(),pays:[]});LD=LN.length-1;LT='ov';xs()">Add loan</button>`)}
/* ---- vault lives inside Settings ---- */
const govault=()=>{go('set');setTimeout(()=>{const e=document.getElementById('vault-sec');if(e)e.scrollIntoView({behavior:'smooth',block:'start'})},450)};
const sj=id=>{const e=document.getElementById(id);if(e)e.scrollIntoView({behavior:'smooth',block:'start'})};
const S11=V.set,VR=V.vault;
V.set=()=>S11().replace('</h1>','</h1><div class=row style="margin:8px -20px 0">'+[['s-app','Appearance'],['s-money','Money'],['s-auto','Automation'],['vault-sec','Vault'],['s-data','App']].map(x=>`<span class=pill onclick="sj('${x[0]}')">${x[1]}</span>`).join('')+'</div>').replace('<div class=cap>Appearance</div>','<div id=s-app class=cap>Appearance</div>').replace('<div class=cap>Money</div>','<div id=s-money class=cap>Money</div>').replace('<div class=cap>Automation</div>','<div id=s-auto class=cap>Automation</div>').replace(/<button class=btn onclick="govault\(\)">Export, import & backup<\/button>/,'').replace('<div class=cap>Data</div>',`<div id=vault-sec class=cap style="display:flex;gap:10px;align-items:center;margin-top:30px"><span>Vault · your data</span></div>${VR().replace(/^[\s\S]*?<\/h1>/,'')}<div id=s-data class=cap>App</div>`);
V.vault=()=>{go('set');return V.set()};
KS.LN=LN;
function tiles(){const W2={home:1,cc:1,tool:1},F={set:1},AL={cc:CC.some((c,i)=>cdue(i)),bud:B.some(b=>b[2]/(b[1]||1)>.85),sub:SB.some(s=>s[3]&&s[4]),loan:LN.some(l=>lnDue(l).overdue)};return`<div class=jq><span class=mu>⌕</span><input id=jq placeholder="Jump to anything, or ask a question…" oninput="jf()" onkeydown="event.key=='Enter'&&jg()"></div><div class=qa><span class=pill onclick="qa(addx)">＋ Transaction</span><span class=pill onclick="qa(()=>go('cc'))">Pay card</span><span class=pill onclick="qa(()=>go('split'))">Split bill</span><span class=pill onclick="qa(ask)">Ask Spendwiser</span></div>`+N.map((n,i)=>`<button class="tl ${n[0]==cur?'cur':''} ${W2[n[0]]?'w':''} ${F[n[0]]?'f':''} ${AL[n[0]]?'al':''}" style="--i:${i};${n[0]==cur?'':'--cc:'+TC[n[0]]+'24;--cl:'+TC[n[0]]}" data-k=${n[0]} onclick="go('${n[0]}')"><span class=ch>${ic(n[0])}</span><div><b>${n[1]}</b><small>${ST2[n[0]]()}</small></div></button>`).join('')}
build();go('home');
</script></body></html>
